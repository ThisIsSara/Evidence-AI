<!-- _pipeline_section.html
     Shared "Investigation Pipeline" block: reused by case_detail.html (demo case)
     and new_investigation.html (custom case). Included with two variables already
     set by the parent template:
       run_button_id       - the button's element id (JS looks for this)
       run_button_i18n_key - which i18n.js key to use for the button's label
     Hidden entirely when printing - it's a processing control, not report content. -->
<section class="no-print max-w-5xl mx-auto px-6 py-8">
    <h2 class="text-sm font-semibold uppercase tracking-widest text-slate-500 mb-4" data-i18n="pipeline_heading">
        Investigation Pipeline
    </h2>
    <div id="pipeline-steps" class="grid sm:grid-cols-4 gap-4">
        {% for step_number in range(1, 5) %}
        <div id="step-{{ step_number }}" class="pipeline-step bg-slate-900 border border-slate-800 rounded-xl p-4 text-center transition-colors">
            <div class="pipeline-step-number w-7 h-7 mx-auto rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-400 text-sm font-bold mb-2 transition-colors">
                {{ step_number }}
            </div>
            <p class="text-sm text-slate-300" data-i18n="pipeline_step_{{ step_number }}"></p>
            <p class="pipeline-step-status text-xs text-slate-500 mt-1" data-i18n="pipeline_status_pending">Pending</p>
        </div>
        {% endfor %}
    </div>

    <!-- Run button + status area -->
    <div class="mt-8 text-center">
        <button id="{{ run_button_id }}" type="button" data-i18n="{{ run_button_i18n_key }}"
                class="px-6 py-3 rounded-lg bg-teal-500 hover:bg-teal-400 text-slate-950 font-semibold transition-colors disabled:opacity-60 disabled:cursor-not-allowed"></button>
        <p id="pipeline-status" class="mt-4 text-sm text-slate-400 min-h-[1.25rem]"></p>
    </div>
</section>
